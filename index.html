         (açıq temanın yanıb-sönməsi olmasın). Qayda src/contexts/LangContext.jsx ilə EYNİDİR. -->
    <script>(function(){var t=null;try{t=localStorage.getItem('muslim_cc_theme')}catch(e){}try{if(t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#0a1016')}}catch(e){}})()</script>

         PERFORMANCE — DNS Prefetch & Preconnect
    ═══════════════════════════════════════════════ -->
    <!-- Şriftlər artıq öz origin-imizdədir (src/assets/fonts) — fonts.googleapis.com /
         fonts.gstatic.com preconnect-i lazım deyil. Namaz vaxtları API-si ana səhifənin
         ilk ekranında sorğulanır: preconnect DNS+TLS-i JS yüklənərkən hazırlayır
         (fetch CORS "anonymous" rejimdədir, ona görə crossorigin). -->
    <link rel="preconnect"    href="https://api.aladhan.com" crossorigin />
    <link rel="dns-prefetch"  href="https://api.alquran.cloud" />
    <link rel="dns-prefetch"  href="https://cdn.islamic.network" />
