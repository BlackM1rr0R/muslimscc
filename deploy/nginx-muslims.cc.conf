# ═══════════════════════════════════════════════════════
# Muslims.cc — nginx konfiqurasiyası
#
# Serverdə yeri:  /etc/nginx/sites-available/muslims.cc
# Aktivləşdirmək:
#   ln -s /etc/nginx/sites-available/muslims.cc /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ƏN VACİB SƏTİR — location / içindəki try_files.
# Onsuz /quran, /ru/quran kimi ünvanlar 404 verir və prerender edilmiş
# 152 HTML faylının heç biri istifadə olunmur.
#
# QEYD: dist/.htaccess yalnız Apache üçündür, nginx onu oxumur.
# Bu serverdə marşrutlaşdırma yalnız bu fayl vasitəsilə işləyir.
# ═══════════════════════════════════════════════════════

# ── HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name muslims.cc www.muslims.cc;
    return 301 https://muslims.cc$request_uri;
}

# ── www → kök domen (kanonik forma) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.muslims.cc;

    # SSL sertifikatları — certbot bu sətirləri özü də əlavə edə bilər
    ssl_certificate     /etc/letsencrypt/live/muslims.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muslims.cc/privkey.pem;

    return 301 https://muslims.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muslims.cc;

    ssl_certificate     /etc/letsencrypt/live/muslims.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muslims.cc/privkey.pem;

    root  /var/www/muslims;
    index index.html;

    # Yüklənən faylların ölçü limiti
    client_max_body_size 10M;

    # ── Sıxılma ──
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # ── API — PM2-də işləyən Node (muslim-cc-api, port 3001) ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Sondakı "/" -i sil ──
    # /quran/ və /quran ayrıca indekslənməsin deyə tək kanonik forma.
    rewrite ^/(.*)/$ /$1 permanent;

    # ── Hash-li fayllar — məzmun dəyişəndə ad da dəyişir ──
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service worker və sitemap həmişə təzə oxunsun ──
    location = /sw.js                    { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /firebase-messaging-sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /sitemap.xml              { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /robots.txt               { add_header Cache-Control "no-cache, must-revalidate"; }

    # ── Şəkillər və şriftlər ──
    location ~* \.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── ƏSAS MARŞRUTLAŞDIRMA ──
    # $uri               → həqiqi fayl varsa onu ver (/og-image.png)
    # $uri/index.html    → prerender edilmiş marşrut (/quran → /quran/index.html)
    # /index.html        → naməlum yollar üçün SPA
    #
    # Diqqət: "$uri/" YOX, "$uri/index.html" yazılıb — birincisi nginx-i
    # sonuna "/" əlavə edən 301-ə məcbur edir və kanonik URL-i pozur.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Təhlükəsizlik başlıqları ──
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN"               always;
}
