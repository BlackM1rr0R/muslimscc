# ═══════════════════════════════════════════════════════
# Qaraçuxur Məscidi (muslims.cc) — nginx konfiqurasiyası
#
# Serverdə yeri:  /etc/nginx/sites-available/muslims.cc
# Aktivləşdirmək:
#   ln -s /etc/nginx/sites-available/muslims.cc /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ƏN VACİB SƏTİR — location / içindəki try_files.
# Onsuz /quran, /ru/quran kimi ünvanlar 404 verir və prerender edilmiş
# HTML fayllarının heç biri istifadə olunmur.
#
# HƏQİQİ 404: naməlum ünvan (/nope, /ru/nope) artıq ana səhifəni 200 ilə
# YOX, dist/404.html-i HTTP 404 statusu ilə alır ("soft-404" bitdi).
# 404.html-i build (scripts/prerender.mjs) yazır — deploy zamanı dist/-in
# hamısı /var/www/muslims/-ə köçürülməlidir, 404.html daxil.
# SIRA VACİBDİR: əvvəl 404.html-li yeni dist/ yüklənir, SONRA bu konfiq
# nginx-ə verilir (əks halda naməlum ünvanlar nginx-in boz 404-ünü görür).
#
# Canlı serverdə aktiv fayl: /etc/nginx/sites-enabled/muslims.cc
# (certbot orada öz SSL sətirlərini saxlaya bilər — faylı körü-körünə
# əvəz etmə; dəyişən blokları köçür, sonra: nginx -t && systemctl reload nginx)
#
# Yoxlama (reload-dan sonra):
#   curl -sI https://muslims.cc/            → 200
#   curl -sI https://muslims.cc/ru/quran    → 200
#   curl -sI https://muslims.cc/az/quran    → 301 → /quran
#   curl -sI https://muslims.cc/bu-yoxdur   → 404 (gövdə: 404.html)
#   curl -sI https://muslims.cc/404.html    → 404
#
# QEYD: dist/.htaccess yalnız Apache üçündür, nginx onu oxumur.
# Bu serverdə marşrutlaşdırma yalnız bu fayl vasitəsilə işləyir.
# ═══════════════════════════════════════════════════════

# ── HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name muslims.cc www.muslims.cc;
    return 301 https://muslims.cc$request_uri;
}

# ── www → kök domen (kanonik forma) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.muslims.cc;

    # SSL sertifikatları — certbot bu sətirləri özü də əlavə edə bilər
    ssl_certificate     /etc/letsencrypt/live/muslims.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muslims.cc/privkey.pem;

    return 301 https://muslims.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muslims.cc;

    ssl_certificate     /etc/letsencrypt/live/muslims.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muslims.cc/privkey.pem;

    root  /var/www/muslims;
    index index.html;

    # Yüklənən faylların ölçü limiti
    client_max_body_size 10M;

    # ── Sıxılma ──
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # ── API — PM2-də işləyən Node (muslim-cc-api, port 3001) ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── /az/... → prefiksiz kanonik forma ──
    # Azərbaycan dili prefiksizdir (/quran), /az/quran üçün statik fayl
    # yazılmır. Tətbiq bu ünvanı tanıyır, ona görə 404 yox, 301 verilir.
    # /az → /,  /az/quran → /quran  (sorğu parametrləri saxlanılır)
    rewrite ^/az(?:/(.*))?$ /$1 permanent;

    # ── Sondakı "/" -i sil ──
    # /quran/ və /quran ayrıca indekslənməsin deyə tək kanonik forma.
    rewrite ^/(.*)/$ /$1 permanent;

    # ── Hash-li fayllar — məzmun dəyişəndə ad da dəyişir ──
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Öz add_header-i olan location server səviyyəsindəki başlıqları miras almır — təkrar yazılır
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── Service worker və sitemap həmişə təzə oxunsun ──
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── Şəkillər və şriftlər ──
    location ~* \.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
        # Öz add_header-i olan location server səviyyəsindəki başlıqları miras almır — təkrar yazılır
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── 404 səhifəsi ──
    # Server səviyyəsində: bütün location-lar üçün keçərlidir. /api/-yə
    # toxunmur — proxy_intercept_errors söndürülüdür (default), Node-un öz
    # JSON 404 cavabı olduğu kimi keçir.
    # 404.html SPA qabığıdır: brauzerdə tətbiq yüklənir və "Səhifə tapılmadı"
    # səhifəsini URL-in dilində göstərir (/ru/nope → rusca). noindex-dir.
    error_page 404 /404.html;

    # internal: /404.html birbaşa açılanda da 404 statusu alır (200 ilə
    # indekslənə bilən dublikat olmasın); error_page-in daxili yönləndirməsi
    # isə işləyir. "always" — add_header 404 cavabına da yazılsın deyə.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Öz add_header-i olan location server səviyyəsindəki başlıqları miras almır — təkrar yazılır
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── Ana səhifə ──
    # Açıq yazılıb: "/" üçün $uri/index.html "//index.html" olur — işləyir,
    # amma artıq ehtiyat "/index.html" fallback-i olmadığı üçün birbaşa verilir.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        # Öz add_header-i olan location server səviyyəsindəki başlıqları miras almır — təkrar yazılır
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── ƏSAS MARŞRUTLAŞDIRMA ──
    # $uri               → həqiqi fayl varsa onu ver (/og-image.png)
    # $uri/index.html    → prerender edilmiş marşrut (/quran → /quran/index.html)
    # =404               → qalan hər şey HƏQİQİ 404 (yuxarıdakı error_page
    #                      /404.html-i verir). Əvvəl burada /index.html idi:
    #                      hər naməlum ünvan 200 + ana səhifə qaytarırdı.
    #
    # Diqqət: "$uri/" YOX, "$uri/index.html" yazılıb — birincisi nginx-i
    # sonuna "/" əlavə edən 301-ə məcbur edir və kanonik URL-i pozur.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        # Öz add_header-i olan location server səviyyəsindəki başlıqları miras almır — təkrar yazılır
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ── Təhlükəsizlik başlıqları ──
    add_header X-Content-Type-Options "nosniff"                  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN"               always;
}
