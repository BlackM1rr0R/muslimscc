<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Instagram kartları (server/instagramCard.js): yalnız bu qovluqdakı şriftlər. Konteynerdə sistem şrifti yoxdur;
     kök fayl sistemi read-only-dir, keş /tmp-dədir (tmpfs). FONTCONFIG_FILE-i instagramCard.js təyin edir (Linux). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/mcc-fontconfig</cachedir>
</fontconfig>
