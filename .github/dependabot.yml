# CI action-ları tam commit SHA ilə bağlanıb (.github/workflows/ci.yml, "# v4" şərhi ilə).
# Dependabot yalnız onları yeniləmək üçün PR açır (birləşdirmə — əl ilə, CI yaşıl olandan sonra).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Böyük versiyalar (v4 → v7) CI/deploy-u sındıra bilər — yalnız patch/minor (təhlükəsizlik düzəlişləri).
    # Böyük keçid lazım olanda əl ilə, ayrıca yoxlanaraq edilir.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
