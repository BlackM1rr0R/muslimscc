# ═══════════════════════════════════════════════════════
# Muslims.cc — CI/CD
#
# Hər push və PR:  yoxlamalar → unit testlər → build → e2e (Playwright)
#                  → Docker image-lərinin build-i
# main-ə push:     + serverə deploy (avtomatik sağlamlıq yoxlaması və
#                    alınmasa köhnə versiyaya qayıdış — infra/deploy.sh)
#
# Lazım olan GitHub sirləri (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST          serverin IP-si
#   DEPLOY_SSH_KEY       CI açarının PRIVATE hissəsi (~/.ssh/muslimscc_ci)
#   DEPLOY_KNOWN_HOSTS   `ssh-keyscan -t ed25519 <IP>` çıxışı (MITM qoruması)
#   ADMIN_PATH           (istəyə bağlı) gizli admin paneli ünvanı, ^/[a-z0-9-]{8,40}$ — web image-in build-inə
#                        VITE_ADMIN_PATH kimi düşür (docs/ADMIN-SECURITY.md). e2e build-i onsuzdur (/account/panel).
# Bu açar serverdə yalnız infra/ci-gate.sh-ı işlədə bilər (shell ala bilməz).
# ═══════════════════════════════════════════════════════
name: CI/CD

on:
  # Push yalnız main-də (deploy); digər branch-lar PR ilə yoxlanır. 2026-11-19: Dependabot branch-ları push+PR
  # ilə hər main push-dan sonra tam CI işlədirdi və runner-ləri doldururdu (main CI 30 dəq gözlədi).
  # Yalnız sənəd/agent faylları dəyişibsə (README, docs/, .claude/) CI və deploy işləmir — sayta
  # təsiri yoxdur (build *.md oxumur). Kod + sənəd birlikdədirsə adi qaydada işləyir.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'

# Sxem (kritik yol: build → e2e → deploy; qalanı paralel):
#   checks  ─────────────────────────────┐
#   build ── e2e (12 maşın) ─────────────┼── deploy (main)
#   images (Docker, nginx -t, api smoke) ┘
jobs:
  # ── 1a) Sürətli yoxlamalar + unit testlər (build-i gözləmir) ──
  checks:
    name: Yoxlamalar, unit testlər
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci

      - name: Brend konfiqi veb ↔ mobil eynidir
        run: node scripts/check-config-sync.mjs
      - name: Dil təmizliyi (az-da türkcə yox və s.)
        run: node scripts/check-lang.mjs
      - name: Hərəkət performansı (sonsuz animasiya yalnız transform/opacity)
        run: node scripts/check-motion.mjs
      - name: CSP (inline skript hash-i nginx siyasətindədir)
        run: node scripts/check-csp.mjs
      - name: ESLint (hook qaydaları, istifadəsiz kod)
        run: npm run lint
      # server-inline.test.js əsl server.js-i işə salır — server/ asılılıqları (express, cors…) lazımdır
      - name: Server asılılıqları
        run: npm ci --prefix server --omit=dev --no-audit --no-fund
      - name: Unit testlər
        run: npm run test:unit
      - name: API sintaksisi
        run: for f in server/*.js; do node --check "$f"; done

  # ── 1b) Build — e2e yalnız bunu gözləyir (əvvəl yoxlamalar + unit testlərdən sonra başlayırdı: +2 dəq) ──
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # ADMIN_PATH sirri (gizli admin ünvanı) bu build-ə QƏSDƏN yazılmır: bu dist yalnız e2e üçündür və testlər
      # susmaya görə /account/panel-dədir; sirr Playwright hesabatlarına/izlərinə düşməsin. İstehsal build-i — images job.
      # Burada yalnız format yoxlanır (səhv sirr deploy-dan əvvəl tez yıxılsın); dəyər çap olunmur.
      - name: ADMIN_PATH sirrinin formatı
        env: { ADMIN_PATH: '${{ secrets.ADMIN_PATH }}' }
        run: |
          if [ -n "$ADMIN_PATH" ] && ! printf '%s' "$ADMIN_PATH" | grep -Eqx '/[a-z0-9-]{8,40}'; then
            echo "::error::ADMIN_PATH sirri ^/[a-z0-9-]{8,40}$ formatında olmalıdır"; exit 1
          fi
      - name: Build
        run: |
          cp .env.public .env.production.local
          npm run build
          test -f dist/404.html && test -f dist/sitemap.xml
      # JSON-LD (sintaksis + tələb olunan sahələr, saxta reytinq yox), canonical, hreflang özünə istinad və
      # qarşılıqlılıq, noindex səhifələr — dist nümunəsi (~1100 səhifə, ~10 san). scripts/check-seo-dist.mjs
      - name: SEO yoxlaması (dist)
        run: node scripts/check-seo-dist.mjs dist
      # ~45k kiçik fayl: upload-artifact onları tək-tək göndərəndə 62 san çəkirdi — bir arxiv kimi saniyələrdir
      - name: dist arxivi
        run: tar -I 'zstd -T0 -3' -cf dist.tar.zst dist && ls -l dist.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: dist, path: dist.tar.zst, retention-days: 3, compression-level: 0 }

  # ── 2) Real brauzerdə e2e (kompüter + telefon) — 12 paralel maşın ──
  # Playwright --shard testləri SAYA görə bölür, vaxta görə yox. Ağır a11y-all (hər səhifədə axe) tema üzrə
  # iki ayrı maşında; a11y.spec qaranlıq a11y maşınında. Qalanı 10 hissədə: 2026-11-18 (run 44392783483)
  # 4 hissənin cəmi 30.9 dəq test vaxtı idi (8.0/9.7/5.8/7.4) → 10 hissədə ~3.1 dəq orta, ən ağırı ~4 dəq.
  # Deploy hamısını gözləyir.
  e2e:
    name: E2E (${{ matrix.name }})
    needs: build
    # Dependabot PR-larında yalnız yoxlamalar + build (action yeniləməsi e2e-ni dəyişmir)
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ['1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10', '10/10']
        include:
          # 2026-11-19: a11y qaranlıq + a11y.spec 7.3 dəq, işıqlı 5.8 dəq idi — hər biri 2 hissəyə
          - { name: 'a11y işıqlı 1/2', grep: 'a11y \(light\)', shard: '1/2' }
          - { name: 'a11y işıqlı 2/2', grep: 'a11y \(light\)', shard: '2/2' }
          - { name: 'a11y qaranlıq + a11y.spec 1/2', grep: 'a11y \(dark\)|a11y\.spec', shard: '1/2' }
          - { name: 'a11y qaranlıq + a11y.spec 2/2', grep: 'a11y \(dark\)|a11y\.spec', shard: '2/2' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist }
      - run: tar -I zstd -xf dist.tar.zst && rm dist.tar.zst
      - name: Playwright versiyası
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Brauzer keşi
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}-chromium
      - name: Playwright brauzeri
        # Adətən ~10 san. apt güzgüsü ləng/əlçatmaz olanda (2026-11-11 DNS xətası; 2026-11-18 bir maşında
        # 6 dəq 19 san) — 2 dəqiqədən sonra sistem paketsiz quraşdırma: ubuntu-latest-də Chromium-un
        # kitabxanaları var, çatmasa testlər özü yıxılır
        run: timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: E2E testləri
        env: { G: '${{ matrix.grep }}', N: '${{ matrix.name }}', SH: '${{ matrix.shard }}' }
        # a11y maşınları: --grep (+ öz --shard-ı); qalan 10 hissə: a11y-siz, --shard <N>
        run: |
          if [ -n "$G" ]; then set -- --grep "$G" --shard "$SH"
          else set -- --grep-invert 'a11y \((light|dark)\)|a11y\.spec' --shard "$N"; fi
          echo "npx playwright test $*"
          npx playwright test "$@"
      - name: Hesabat (yıxılanda)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'playwright-report-${{ strategy.job-index }}', path: playwright-report, retention-days: 7 }

  # ── 3) Docker image-ləri (hər push-da build olunur ki, Dockerfile sınmasın) — heç nəyi gözləmir ──
  images:
    name: Docker image-ləri
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      api_src: ${{ steps.tag.outputs.api_src }}
      web_src: ${{ steps.tag.outputs.web_src }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # cc.muslims.src — image-in mənbəyinin git həşi: api = server/ qovluğu (kontekst), web = server/-dən
      # başqa hər şey (web build server/-i oxumur). Serverdə eyni mənbəli image varsa deploy onu yükləmir
      # (ci-gate "reuse") və deploy.sh eyni image-i yenidən başlatmır.
      - id: tag
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "api_src=$(git rev-parse HEAD:server)" >> "$GITHUB_OUTPUT"
          echo "web_src=$(git ls-tree HEAD | grep -vP '\tserver$' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Gizli admin ünvanı (istəyə bağlı sirr ADMIN_PATH) → BuildKit sirri faylı "VITE_ADMIN_PATH=<dəyər>"
      # (sirr yoxdursa boş fayl → /account/panel). Format yoxlanır, dəyər çap olunmur; image metadata-sına düşmür.
      - name: Gizli admin ünvanı (ADMIN_PATH sirri)
        env: { ADMIN_PATH: '${{ secrets.ADMIN_PATH }}' }
        run: |
          f="$RUNNER_TEMP/admin_path"
          ( umask 077; : > "$f" )
          if [ -n "$ADMIN_PATH" ]; then
            printf '%s' "$ADMIN_PATH" | grep -Eqx '/[a-z0-9-]{8,40}' || { echo "::error::ADMIN_PATH sirri ^/[a-z0-9-]{8,40}$ formatında olmalıdır"; exit 1; }
            printf 'VITE_ADMIN_PATH=%s\n' "$ADMIN_PATH" > "$f"
          fi

      - name: api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          tags: muslimscc-api:${{ steps.tag.outputs.tag }}
          labels: cc.muslims.src=${{ steps.tag.outputs.api_src }}
          outputs: type=docker,dest=/tmp/api.tar
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/web.Dockerfile
          secret-files: admin_path=${{ runner.temp }}/admin_path
          tags: muslimscc-web:${{ steps.tag.outputs.tag }}
          labels: cc.muslims.src=${{ steps.tag.outputs.web_src }}
          outputs: type=docker,dest=/tmp/web.tar
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: nginx konfiqi image-in içində keçərlidir
        run: |
          docker load -i /tmp/web.tar
          mkdir -p /tmp/c && openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=muslims.cc \
            -keyout /tmp/c/privkey.pem -out /tmp/c/fullchain.pem 2>/dev/null && chmod 644 /tmp/c/*.pem
          docker run --rm -v /tmp/c:/certs:ro muslimscc-web:${{ steps.tag.outputs.tag }} nginx -t
          docker image inspect -f '{{index .Config.Labels "cc.muslims.edge"}}' muslimscc-web:${{ steps.tag.outputs.tag }} | grep -qx 1

      # Kənar (edge) konteynerinin konfiqi — serverdəki ilə eyni (digest-li) image-də
      - name: edge nginx konfiqi keçərlidir
        run: |
          img=$(grep -o 'EDGE_IMAGE:-[^}]*' infra/docker-compose.yml | sed 's/^EDGE_IMAGE:-//')
          test -n "$img"
          docker run --rm --read-only --tmpfs /tmp --add-host web:127.0.0.1 -v "$PWD/infra/edge:/etc/nginx/edge:ro" \
            --entrypoint nginx "$img" -t -c /etc/nginx/edge/nginx.conf

      # API image-i həqiqətən başlayırmı (məs. Dockerfile-a düşməyən modul —
      # 2026-11-04: "Cannot find module './sync'" yalnız serverdə üzə çıxdı)
      - name: api image başlayır və /api/health cavab verir
        run: |
          docker load -i /tmp/api.tar
          docker run -d --name api-smoke -e OPENROUTER_KEY=ci -e PORT=3001 -e DB_PATH=/tmp/smoke.db \
            --read-only --tmpfs /tmp muslimscc-api:${{ steps.tag.outputs.tag }}
          ok=0
          for i in $(seq 1 25); do
            if docker exec api-smoke node -e "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs api-smoke 2>&1 | tail -20
          docker rm -f api-smoke >/dev/null
          [ "$ok" = 1 ] || { echo "::error::API image başlamadı (yuxarıdakı loga baxın)"; exit 1; }

      - name: Sıxışdır
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gzip -6 /tmp/api.tar /tmp/web.tar && ls -l /tmp/*.tar.gz && [ "$(stat -c%s /tmp/web.tar.gz)" -lt 380000000 ] || { echo "web image 380 MB-dan böyükdür (server həddi 400 MB, infra/ci-gate.sh)"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: images
          path: /tmp/*.tar.gz
          retention-days: 3
          compression-level: 0

  # ── 4) Deploy (yalnız main, bütün testlər keçəndən sonra) ──
  deploy:
    name: Serverə deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://muslims.cc
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TAG: ${{ needs.images.outputs.tag }}
      API_SRC: ${{ needs.images.outputs.api_src }}
      WEB_SRC: ${{ needs.images.outputs.web_src }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: images, path: images }

      - name: SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n' \
            "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config

      # Mənbəyi dəyişməyən image (çox vaxt api) yüklənmir — serverdəki eyni image <TAG> kimi işarələnir.
      # "reuse" alınmasa (yoxdur / köhnə ci-gate.sh) — adi upload.
      - name: Image-ləri yüklə
        run: |
          for n in api web; do
            src=$API_SRC; [ "$n" = web ] && src=$WEB_SRC
            if ssh prod "reuse $TAG $n $src"; then continue; fi
            ssh prod "upload $TAG $n" < "images/$n.tar.gz"
          done

      # IndexNow (scripts/indexnow.mjs): deploy-dan ƏVVƏLKİ canlı SEO manifesti — sonra yenisi ilə müqayisə
      # olunur və yalnız dəyişən URL-lər Bing/Yandex-ə bildirilir. Alınmasa deploy-a təsir etmir.
      - name: IndexNow — köhnə manifest
        continue-on-error: true
        run: curl -fsS --max-time 20 "https://muslims.cc/seo-manifest.json?ci=${GITHUB_RUN_ID}" -o /tmp/seo-old.json || echo '{}' > /tmp/seo-old.json

      - name: Deploy (sağlamlıq yoxlaması + avtomatik geri qaytarma)
        run: ssh prod "deploy $TAG"

      - name: Canlı yoxlama (Cloudflare üzərindən)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://muslims.cc/) && [ "$code" = 200 ] && \
            curl -fsS https://muslims.cc/api/health | grep -q '"ok"' && { echo "✓ canlıdır"; exit 0; }
            sleep 6
          done
          echo "✗ sayt cavab vermir"; exit 1

      # IndexNow — yalnız dəyişən URL-lər (≤ 10 000 / POST, ≤ 20 000 / deploy). Açar açıqdır (public/<açar>.txt,
      # protokolun tələbi). Deploy-un nəticəsinə təsir etmir (continue-on-error).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { sparse-checkout: scripts/indexnow.mjs, sparse-checkout-cone-mode: false }
      - name: IndexNow — dəyişən URL-ləri bildir
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 "https://muslims.cc/seo-manifest.json?ci=${GITHUB_RUN_ID}-new" -o /tmp/seo-new.json
          node scripts/indexnow.mjs submit /tmp/seo-old.json /tmp/seo-new.json

      - name: Vəziyyət
        if: always()
        run: ssh prod status || true
