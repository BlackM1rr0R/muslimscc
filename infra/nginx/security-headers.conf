# Təhlükəsizlik başlıqları — hər location-da include olunur.
# Səbəb: nginx-də öz add_header-i olan location server səviyyəsindəki
# başlıqları MİRAS ALMIR; bir yerdə saxlayıb hər yerə include etmək,
# əvvəlki konfiqdəki kimi hər location-da əl ilə təkrar yazmaqdan etibarlıdır.

# Brauzer saytı yalnız HTTPS ilə açsın (1 il). "preload" qəsdən yoxdur —
# preload siyahısından çıxmaq aylar çəkir, əvvəl bir müddət müşahidə edək.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
# Yer (namaz vaxtı, qiblə) yalnız saytın özü üçün; kamera/mikrofon heç vaxt
# camera — halal yoxlamasında barkod skaneri; microphone — hifzdə öz qiraətini yazmaq (yalnız saytın özü)
add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# ── Content-Security-Policy — HƏLƏLİK YALNIZ HESABAT (Report-Only): heç nə bloklanmır ──
# Pozuntular /api/csp-report-a gəlir (server/csp.js), admin: GET /api/admin/csp.
# Bir neçə gün təmiz qalsa, başlıq adını "Content-Security-Policy" et (tətbiq rejimi).
# script-src: yalnız öz faylımız + index.html-dəki tema skriptinin hash-i
#   (skript dəyişsə hash də dəyişməlidir — scripts/check-csp.mjs CI-da yoxlayır).
# Cloudflare "JS Detections" inline skripti hash-lənə bilmir (hər sorğuda fərqlidir) —
#   hesabatda süzülür; tətbiq rejimində bloklanacaq (bot aşkarlaması işləməz).
# style-src 'unsafe-inline': React style atributları və vizuallar (CSS dəyişənləri) üçün.
# img/media https: — Wikimedia şəkilləri, YouTube önizləmələri, qiraət səsləri çox mənbədəndir.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-gJhnbHPyqI6whIgJeLhRD1JRVqypooQt6cGSCmjkjGo=' 'report-sample' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://api.alquran.cloud https://api.quran.com https://api.aladhan.com https://api.exchangerate-api.com https://geocoding-api.open-meteo.com https://hadeethenc.com https://quranenc.com https://world.openfoodfacts.org https://overpass-api.de https://overpass.kumi.systems https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cdn.islamic.network https://verses.quran.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;
