# ═══════════════════════════════════════════════════════
# Muslims.cc — nginx (Docker "web" konteyneri)
#
# Konteyner: nginxinc/nginx-unprivileged — root OLMADAN işləyir (uid 101),
# ona görə 80/443 yox, 8080/8443 dinləyir; docker-compose host-un 80/443
# portlarını bura yönləndirir.
#
# Yanında: cloudflare.conf (real IP + $from_cloudflare, http səviyyəsində
# conf.d-dən avtomatik yüklənir), security-headers.conf (snippets/).
#
# Marşrutlaşdırma qaydaları köhnə deploy/nginx-muslims.cc.conf-dan (host nginx
# dövrü; fayl silinib, geniş izahat git tarixçəsindədir) köçürülüb. Fərqlər:
#   • yalnız Cloudflare-dən gələn bağlantı qəbul edilir (444 — cavabsız kəs)
#   • /api/ → "api" konteyneri (Docker şəbəkəsi), internetə açıq port yoxdur
#   • sertifikat /certs-dən (host-dakı certbot deploy-hook kopyalayır)
#   • ACME (Let's Encrypt yeniləmə) yolu /var/www/certbot-dan verilir
# ═══════════════════════════════════════════════════════

# API — Docker DNS adı "api". Kəsintisiz deploy (infra/deploy.sh) zamanı adın arxasında bir neçə
# saniyə İKİ konteyner olur (köhnə + yeni); "resolve" siyahını ~2 saniyədə bir təzələyir.
#   • Köhnə api SIGTERM alanda dinləməni dayandırır, amma 4 san yaşayır (server.js LINGER_MS):
#     cəhd dərhal "refused" alır → sorğu yeni api-yə keçir (proxy_next_upstream error timeout;
#     POST yalnız hələ göndərilməmişsə) və köhnə ünvan max_fails=1 ilə 10 san "ölü" sayılır.
#   • Ona görə konteyner ölüb ünvanı cavabsız qalanda (DNS-dən silinənə qədər) ora sorğu getmir.
#     Getsəydi: siyahı dəyişən an yarımçıq cəhdin növbəti ünvanı tapılmırdı (502/504 — staging-də
#     ölçülüb; nginx round-robin "tried" bitmap-i silinmədən sonra sürüşür).
#   • Tək server qalanda nginx max_fails-ə baxmır ("single") — adi vaxt bir xəta API-ni bağlamır.
#   • Yeni konteyner dinləməzdən əvvəl DNS-də olur və "refused" ilə 10 san ölü sayıla bilər —
#     deploy.sh köhnəni dayandırmazdan əvvəl 11 san gözləyir.
# zone — vəziyyət bütün worker-lər üçün ortaq. proxy_connect_timeout 1s: Docker şəbəkəsində qoşulma
# millisaniyədir. Keepalive YOXDUR (qəsdən): hər sorğu təzə bağlantı — köhnənin bağlanması yarımçıq
# sorğu qoymur.
resolver 127.0.0.11 valid=1s ipv6=off;
upstream api_backend {
    zone api_backend 64k;
    server api:3001 resolve max_fails=1 fail_timeout=10s;
}

# SSE axınları (/api/khatm/live, /api/read-together/<id>/events) — bir IP-dən eyni anda ən çox 8
# açıq bağlantı (hər axın saatlarla açıq qalır; bir müştəri api-nin bütün bağlantılarını tutmasın).
# $binary_remote_addr — cloudflare.conf-dan sonra ziyarətçinin real IP-si.
limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;

