# ── HTTP: yalnız ACME yoxlaması, qalanı → HTTPS ──
server {
    listen 8080;
    server_name muslims.cc www.muslims.cc _;

    if ($from_cloudflare = 0) { return 444; }

    # Docker healthcheck və deploy.sh (yalnız konteynerin içindən: 127.0.0.1)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://muslims.cc$request_uri;
    }
}

# ── Naməlum host (birbaşa IP ilə gələn skanerlər və s.) ──
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    return 444;
}

# ── www → kök domen ──
server {
    listen 8443 ssl;
    http2 on;
    server_name www.muslims.cc;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    if ($from_cloudflare = 0) { return 444; }
    return 301 https://muslims.cc$request_uri;
}

# ── Əsas sayt ──
server {
    listen 8443 ssl;
    http2 on;
    server_name muslims.cc;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Origin IP-ni tapıb Cloudflare-dən yan keçən skanerlər burada kəsilir
    if ($from_cloudflare = 0) { return 444; }

    root  /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Yönləndirmələr (rewrite … permanent: /az/*, /mosque, sonda "/") nisbi Location
    # versin. Əks halda nginx konteynerin daxili portunu əlavə edirdi:
    # "Location: https://muslims.cc:8443/about" — 8443 internetə açıq deyil,
    # yəni bütün köhnə/301 linklər ölü idi (QA tarama, canlı sayt).
    absolute_redirect off;
    client_max_body_size 1m;   # API yalnız kiçik JSON qəbul edir

    # PERFORMANS: build zamanı scripts/prerender.mjs hər mətn faylının yanına
    # səviyyə-9 .gz surəti yazır — nginx onu hazır verir (hər sorğuda yenidən
    # sıxmır: daha az CPU, daha tez TTFB, ~3-5% kiçik fayl). .gz yoxdursa
    # (məs. kiçik fayllar) aşağıdakı dinamik gzip işləyir.
    gzip_static       on;
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ── API — "api" konteyneri ──
    # Kukisiz statistika mayakı (server/analytics.js): hər səhifə açılışında
    # gəlir — IP-lər giriş jurnalına YAZILMASIN (məxfilik siyasəti ilə eyni)
    location = /api/a {
        access_log off;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 1s;
        proxy_read_timeout    15s;
    }

    # "Birlikdə Quran oxu" (server/readTogether.js) — Server-Sent Events axını: buferləmə YOX
    # (hadisə dərhal çatsın), uzun oxuma vaxtı (server hər 25 san ": k" göndərir). Yalnız bu yol.
    # URL-dəki ?t= birdəfəlik, 60 saniyəlik biletdir (sirr deyil) — buna baxmayaraq jurnal yazılmır.
    location ~ "^/api/read-together/[a-z0-9]{10}/events$" {
        access_log off;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_connect_timeout 1s;
        proxy_read_timeout    3600s;
        limit_conn         sse_per_ip 8;
        limit_conn_status  429;
    }

    # "Ümmətin Canlı Xətmi" (server/globalKhatm.js) — İCTİMAİ SSE axını (yalnız toplu məlumat, sirr yoxdur):
    # buferləmə YOX, uzun oxuma vaxtı (server hər 25 san ": k" göndərir). Dəqiq yol — regex deyil.
    location = /api/khatm/live {
        access_log off;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_connect_timeout 1s;
        proxy_read_timeout    3600s;
        limit_conn         sse_per_ip 8;
        limit_conn_status  429;
    }

    # Şəxsi təqvim axını (server/calFeed.js): /api/cal/<gizli token>.ics — URL-in özü sirdir,
    # giriş jurnalına YAZILMASIN. Prefiks (^~) — regex deyil; /api/cal-feed (idarə) buraya düşmür.
    location ^~ /api/cal/ {
        access_log off;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 1s;
        proxy_read_timeout    30s;
    }

    # Instagram kartları (server/instagram.js): /api/ig/card/<ad>.jpg — Meta bu URL-dən şəkli çəkir.
    # Prefiks (^~) MÜTLƏQDİR: əks halda aşağıdakı ~* \.(jpe?g|…)$ statik regex qaydası /api/-dən
    # üstün gəlir və sorğu API-yə çatmır (nginx 404 — 2026-11-25 tapıldı).
    location ^~ /api/ig/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 1s;
        proxy_read_timeout    30s;
    }

    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Real IP (cloudflare.conf-dan sonra $remote_addr = ziyarətçi).
        # Gələn X-Forwarded-For zəncirini ÖTÜRMÜRÜK — saxtalaşdırıla bilər;
        # API "trust proxy 1" ilə məhz bu dəyəri rate-limit üçün götürür.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 1s;
        proxy_read_timeout    60s;
    }

    # /az/... → prefiksiz kanonik forma
    rewrite ^/az(?:/(.*))?$ /$1 permanent;

    # Silinmiş /mosque səhifəsi → eyni dildə /about (Qaraçuxur dövründən)
    rewrite ^/mosque/?$ /about permanent;
    rewrite ^/(en|ru|ar|tr)/mosque/?$ /$1/about permanent;

    # Silinmiş /open-data bölməsi (2026-11) → ana səhifə
    rewrite ^/open-data(/.*)?$ / permanent;
    rewrite ^/(en|ru|ar|tr)/open-data(/.*)?$ /$1 permanent;

    # Sondakı "/" — tək kanonik forma
    rewrite ^/(.*)/$ /$1 permanent;

    # Hash-li fayllar — məzmun dəyişəndə ad da dəyişir.
    # ^~ VACİBDİR: adi prefiks olsa, aşağıdakı regex (şəkil/şrift, 30 gün) qalib gəlirdi —
    # /assets/*.woff2 və *.svg 1 il immutable əvəzinə 30 gün alırdı (2026-11-18 auditi).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Yerləşdirilə bilən vidcet — başqa saytlar da yükləyə bilsin (CORS), qısa keş
    location = /widget.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker, sitemap, robots — həmişə təzə
    location ~ ^/(sw\.js|sitemap(-[a-z]+(-[0-9]+)?)?\.xml|robots\.txt|site\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # llms.txt (AI axtarış sistemləri üçün saytın xəritəsi) — UTF-8 mətn, qısa keş
    location = /llms.txt {
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # llms-full.txt — hər detal səhifəsinin başlığı + təsviri + URL-i (scripts/llms-txt.mjs); UTF-8 mətn
    location = /llms-full.txt {
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Şəkillər, şriftlər
    location ~* \.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # v5.8: AR modelləri (Kaaba3D → "Otağında gör"). nginx-in standart mime.types-ində
    # usdz/glb yoxdur — iPhone AR Quick Look düzgün tipi gözləyir. "types" bloku yalnız
    # bu location üçündür (başqa fayl tiplərinə təsir etmir).
    location ^~ /models/ {
        types { model/vnd.usdz+zip usdz; model/gltf-binary glb; }
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Gizli fayllar (.env, .git, .htaccess) — heç vaxt verilmir
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Həqiqi 404 (prerender olunmuş 404.html, SPA dilə görə göstərir)
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Bütün marşrutlar prerender olunur (/quran → /quran/index.html)
    # Məscid ekranı başqa saytlara iframe ilə yerləşdirilə bilər (/widget səhifəsi
    # bu kodu verir) — yalnız bu səhifədə X-Frame-Options yoxdur, frame-ancestors *
    # security-headers.conf include OLUNMUR (orada X-Frame-Options SAMEORIGIN və frame-ancestors 'self'
    # var) — ona görə qalan ortaq başlıqlar burada əl ilə: COOP və Report-Only CSP də (frame-ancestors *).
    # CSP mətni security-headers.conf ilə eyni saxlanılmalıdır (yalnız frame-ancestors fərqlidir).
    location ~ ^/(?:(?:en|ru|ar|tr)/)?mosque-tv$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-6LZEgmYYHXn0YJ5/CfrJEtGgn+4dbwLoHgZIWy3QwyY=' 'report-sample' https://static.cloudflareinsights.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://api.alquran.cloud https://api.quran.com https://api.aladhan.com https://api.exchangerate-api.com https://geocoding-api.open-meteo.com https://api.open-meteo.com https://hadeethenc.com https://quranenc.com https://world.openfoodfacts.org https://overpass-api.de https://overpass.kumi.systems https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cdn.islamic.network https://verses.quran.com https://accounts.google.com/gsi/; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *; report-uri /api/csp-report" always;
    }

    # K1: açıq profil /u/<ləqəb> və /<dil>/u/<ləqəb> → 200 + SPA qabığı ([<dil>/]u/index.html).
    # Qabıqda robots noindex YOXDUR (Google ilkin HTML-də noindex görəndə JS-i render etmir) —
    # səhifə özü yazır: profil var və sahibi icazə veribsə "index", əks halda "noindex"
    # (src/seo/profileSeo.js). Ləqəb qaydası server/publicProfile.js HANDLE_RE ilə eynidir;
    # naməlum dil prefiksi → qabıq tapılmır → 404. {n} olduğu üçün regex dırnaqdadır.
    location ~ "^/((?:[a-z]{2}/)?u)/[a-z0-9_]{3,24}$" {
        try_files /$1/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # BEGIN quran-redirects-location
    # (scripts/gen-quran-redirects.mjs yaradır — əl ilə redaktə etmə) Qısa surə ünvanı → 301 kanonik slug; naməlum nömrə → 404.
    # {n} olduğu üçün regex dırnaqdadır; adlı tutmalar map-ə ($quran_n) ötürülür.
    location ~ "^/(?<quran_pre>(?:(?:en|ru|ar|tr|id|ur|bn|fa|ms|fr|de|es|pt|hi|uz|sw|ha|so|ps|bs|sq|it|nl|zh|ta|ml|te|kn|gu|pa|as|am|om|yo|ff|rw|ku|ky|tg|ug|th|vi|tl|km|ja|sv|ro|sr|si)/)?)quran/(?<quran_n>[1-9][0-9]{0,2})$" {
        if ($quran_slug = "") { return 404; }
        return 301 /${quran_pre}quran/$quran_slug$is_args$args;
    }
    # END quran-redirects-location

    # PWA paylaşma hədəfi (site.webmanifest → share_target, GET /share?title=&text=&url=): sorğu sətrində
    # istifadəçinin ŞƏXSİ paylaşdığı mətn var — giriş jurnalına YAZILMASIN. {n} olduğu üçün regex dırnaqdadır.
    location ~ "^/(?:[a-z]{2,3}/)?share$" {
        access_log off;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
