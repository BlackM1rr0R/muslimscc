# ═══════════════════════════════════════════════════════
# Muslims.cc — nginx (Docker "web" konteyneri)
#
# Konteyner: nginxinc/nginx-unprivileged — root OLMADAN işləyir (uid 101),
# ona görə 80/443 yox, 8080/8443 dinləyir; docker-compose host-un 80/443
# portlarını bura yönləndirir.
#
# Yanında: cloudflare.conf (real IP + $from_cloudflare, http səviyyəsində
# conf.d-dən avtomatik yüklənir), security-headers.conf (snippets/).
#
# Marşrutlaşdırma qaydaları deploy/nginx-muslims.cc.conf-dan (host nginx
# dövrü) köçürülüb — orada geniş izahat var. Burada yalnız fərqlər:
#   • yalnız Cloudflare-dən gələn bağlantı qəbul edilir (444 — cavabsız kəs)
#   • /api/ → "api" konteyneri (Docker şəbəkəsi), internetə açıq port yoxdur
#   • sertifikat /certs-dən (host-dakı certbot deploy-hook kopyalayır)
#   • ACME (Let's Encrypt yeniləmə) yolu /var/www/certbot-dan verilir
# ═══════════════════════════════════════════════════════

# Konteyner yenidən yaradılanda api-nin IP-si dəyişə bilər — Docker DNS-i
# 30 saniyədə bir təzə oxunsun (sabit proxy_pass ünvanı köhnə IP-də qalırdı)
resolver 127.0.0.11 valid=30s ipv6=off;

# ── HTTP: yalnız ACME yoxlaması, qalanı → HTTPS ──
server {
    listen 8080;
    server_name muslims.cc www.muslims.cc _;

    if ($from_cloudflare = 0) { return 444; }

    # Docker healthcheck və deploy.sh (yalnız konteynerin içindən: 127.0.0.1)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://muslims.cc$request_uri;
    }
}

# ── Naməlum host (birbaşa IP ilə gələn skanerlər və s.) ──
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    return 444;
}

# ── www → kök domen ──
server {
    listen 8443 ssl;
    http2 on;
    server_name www.muslims.cc;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    if ($from_cloudflare = 0) { return 444; }
    return 301 https://muslims.cc$request_uri;
}

# ── Əsas sayt ──
server {
    listen 8443 ssl;
    http2 on;
    server_name muslims.cc;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Origin IP-ni tapıb Cloudflare-dən yan keçən skanerlər burada kəsilir
    if ($from_cloudflare = 0) { return 444; }

    root  /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;   # API yalnız kiçik JSON qəbul edir

    # PERFORMANS: build zamanı scripts/prerender.mjs hər mətn faylının yanına
    # səviyyə-9 .gz surəti yazır — nginx onu hazır verir (hər sorğuda yenidən
    # sıxmır: daha az CPU, daha tez TTFB, ~3-5% kiçik fayl). .gz yoxdursa
    # (məs. kiçik fayllar) aşağıdakı dinamik gzip işləyir.
    gzip_static       on;
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ── API — "api" konteyneri ──
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Real IP (cloudflare.conf-dan sonra $remote_addr = ziyarətçi).
        # Gələn X-Forwarded-For zəncirini ÖTÜRMÜRÜK — saxtalaşdırıla bilər;
        # API "trust proxy 1" ilə məhz bu dəyəri rate-limit üçün götürür.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # /az/... → prefiksiz kanonik forma
    rewrite ^/az(?:/(.*))?$ /$1 permanent;

    # Silinmiş /mosque səhifəsi → eyni dildə /about (Qaraçuxur dövründən)
    rewrite ^/mosque/?$ /about permanent;
    rewrite ^/(en|ru|ar|tr)/mosque/?$ /$1/about permanent;

    # Sondakı "/" — tək kanonik forma
    rewrite ^/(.*)/$ /$1 permanent;

    # Hash-li fayllar — məzmun dəyişəndə ad da dəyişir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Service worker, sitemap, robots — həmişə təzə
    location ~ ^/(sw\.js|firebase-messaging-sw\.js|sitemap\.xml|robots\.txt|site\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Şəkillər, şriftlər
    location ~* \.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Gizli fayllar (.env, .git, .htaccess) — heç vaxt verilmir
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Həqiqi 404 (prerender olunmuş 404.html, SPA dilə görə göstərir)
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Bütün marşrutlar prerender olunur (/quran → /quran/index.html)
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
