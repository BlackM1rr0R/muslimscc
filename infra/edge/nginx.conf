# ═══════════════════════════════════════════════════════
# Muslims.cc — kənar (edge) konteyneri: host-un 80/443 portlarının DAİMİ sahibi (serverdə:
# /opt/muslimscc/edge/nginx.conf, docker-compose.yml → "edge").
#
# Niyə: web konteyneri hər deploy-da yenidən yaradılır; portları özü tutanda köhnəsi dayanmamış
# yenisi başlaya bilmirdi → hər deploy-da bir neçə saniyə "connection refused". İndi portları bu
# kiçik L4 proksi tutur və TCP-ni (TLS açılmadan) web konteynerinə ötürür.
#
# Web-in dəyişdirilməsi (infra/deploy.sh): upstream.conf yenidən yazılır və edge "reload" olunur
# (HUP — kəsintisiz: köhnə worker açıq bağlantıları bitirir, yenisi yeni web-ə göndərir):
#   1) keçid: yalnız yeni web-in IP-si  → köhnə web-ə YENİ bağlantı getmir, sonra o, səliqəli dayanır
#   2) sabit: Docker DNS adı "web" (resolve — konteyner yenidən başlasa da IP-ni izləyir)
# DNS-ə arxalanıb köhnəni sadəcə dayandırmaq staging-də 502 verirdi: konteyner ölən an ünvanı
# siyahıdan silinənə qədər ora gedən bağlantının növbəti cəhdi tapılmırdı (nginx "tried" bitmap).
#
# Təhlükəsizlik: TLS, sertifikat, başlıqlar, marşrutlar — hamısı web-dədir (dəyişmədi). Burada yalnız
# "yalnız Cloudflare" qaydası L4-də: cloudflare-allow.conf (gen-cloudflare.sh yaradır). Docker DNAT
# mənbə IP-ni saxlayır, ona görə $remote_addr — həqiqi Cloudflare ünvanıdır.
#
# Bu qovluq image-də deyil, qoşulur (./edge:/etc/nginx/edge:ro). Əl ilə dəyişəndə:
#   docker compose exec edge nginx -t -c /etc/nginx/edge/nginx.conf && docker compose kill -s HUP edge
# nginx ≥ 1.27.3 lazımdır (upstream "resolve").
# ═══════════════════════════════════════════════════════
worker_processes 1;
worker_rlimit_nofile 10240;   # 4096 bağlantı × 2 fd (müştəri + web); konteynerin susmaya görə həddi 1024
# reload-dan sonra köhnə worker açıq bağlantıları (HTTP/2 keep-alive, SSE) ən çox bu qədər saxlayır
worker_shutdown_timeout 30s;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

stream {
    resolver 127.0.0.11 valid=1s ipv6=off;
    include /etc/nginx/edge/cloudflare-allow.conf;
    # web_https / web_http — deploy.sh yazır (repodakı nüsxə: ilk işə salma üçün)
    include /etc/nginx/edge/upstream.conf;

    # Docker şəbəkəsində qoşulma millisaniyədir; 1s — cavabsız ünvan üçün tavan, sonra növbəti ünvan
    proxy_connect_timeout 1s;
    proxy_next_upstream on;
    proxy_next_upstream_tries 3;
    # SSE axınları (server hər 25 san ": k" göndərir) və HTTP/2 keep-alive üçün boşluq vaxtı
    proxy_timeout 10m;

    server {
        listen 8443 backlog=4096;
        proxy_pass web_https;
    }
    server {
        listen 8080;
        proxy_pass web_http;
    }
}
